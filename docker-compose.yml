# INFO: Local development database. Production is managed PostgreSQL (Supabase/Neon).

services:
  postgres:
    image: postgres:17-alpine
    container_name: roroworld-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: roroworld
      POSTGRES_PASSWORD: roroworld
      POSTGRES_DB: roroworld
      TZ: Asia/Seoul
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roroworld -d roroworld"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
